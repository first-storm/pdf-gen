version: "3.9"
services:
  gemini-pdf-agent:
    build: .
    ports:
      - "8290:8000"
    env_file:
      - .env
    environment:
      - GEMINI_PDF_AGENT_WORKDIR=/app/server_runs
      - GEMINI_PDF_AGENT_CONFIG=/app/config.json
    volumes:
      - ./server_runs:/app/server_runs
      - ./config.json:/app/config.json
